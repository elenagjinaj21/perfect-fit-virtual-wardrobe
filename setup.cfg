[flake8]
exclude = .git,.venv,__pycache__,style_studio_*/,exports/,logs/,saves/,database/wardrobe.db
max-line-length = 120
extend-ignore = E203,W503
per-file-ignores =
	__init__.py:F401,F403
	database/create_database.py:E402

[mypy]
python_version = 3.9
ignore_missing_imports = True
check_untyped_defs = True
warn_unused_ignores = True
exclude = ^(style_studio_.*|exports|logs|saves)/